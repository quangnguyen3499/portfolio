name: local-healthchecks

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthchecks
      POSTGRES_USER: healthchecks
      POSTGRES_PASSWORD: ${HC_DB_PASSWORD:-local-only-change-this-db-password}
    volumes:
      - healthchecks-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthchecks -d healthchecks"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: healthchecks/healthchecks:v4.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB: postgres
      DB_HOST: db
      DB_NAME: healthchecks
      DB_PASSWORD: ${HC_DB_PASSWORD:-local-only-change-this-db-password}
      DB_PORT: "5432"
      DB_USER: healthchecks
      DEBUG: "False"
      DEFAULT_FROM_EMAIL: ${HC_SMTP_FROM:-healthchecks@localhost}
      EMAIL_HOST: ${HC_SMTP_HOST:-}
      EMAIL_HOST_USER: ${HC_SMTP_USER:-}
      EMAIL_HOST_PASSWORD: ${HC_SMTP_PASSWORD:-}
      EMAIL_PORT: ${HC_SMTP_PORT:-587}
      EMAIL_USE_SSL: ${HC_SMTP_USE_SSL:-False}
      EMAIL_USE_TLS: ${HC_SMTP_USE_TLS:-True}
      EMAIL_USE_VERIFICATION: "False"
      PING_ENDPOINT: http://localhost:8000/ping/
      REGISTRATION_OPEN: "False"
      SECRET_KEY: ${HC_SECRET_KEY:-local-only-change-this-secret-key}
      SITE_NAME: Local Task Checks
      SITE_ROOT: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  healthchecks-db: